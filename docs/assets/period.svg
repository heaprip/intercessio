<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 626" width="900" height="626" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Период как цикл из трёх фаз вокруг ядра">
<style>
  :root{--muted:#6b7280;--line:#98a2b3;--card:#ffffff;--cardline:#d7dce3;
        --s1:#e8edf7;--s1s:#42557a;--s2:#e4efe7;--s2s:#3d6b4b;--s3:#f6ebdd;--s3s:#7d5c38;
        --hub:#22303f;--hubink:#f5f7fa;--hubmuted:#93a3b4;--ink:#1f2933;}
  @media (prefers-color-scheme: dark){
  :root{--muted:#9aa5b1;--line:#6b7280;--card:#161b22;--cardline:#30363d;
        --s1:#233046;--s1s:#93a8cc;--s2:#1e3328;--s2s:#79b18d;--s3:#3b3022;--s3s:#cba471;
        --hub:#cdd9e5;--hubink:#161b22;--hubmuted:#54637a;--ink:#e6edf3;}}
  .ph{font-size:20px;font-weight:650;letter-spacing:.5px}
  .sub{font-size:12.5px;fill:var(--muted)}
  .box{font-size:15px;font-weight:650;fill:var(--ink)}
  .boxsub{font-size:12px;fill:var(--muted)}
  .edge{font-size:12px;fill:var(--muted);font-style:italic}
  .kick{font-size:10.5px;letter-spacing:2.4px;fill:var(--hubmuted)}
  .hubmain{font-size:14.5px;fill:var(--hubink)}
  .note{font-size:12.5px;fill:var(--muted)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--line)"/></marker></defs>
<path d="M 328.6 203.8 A 150.0 150.0 0 0 1 571.4 203.8 L 529.3 234.4 A 98.0 98.0 0 0 0 370.7 234.4 Z" fill="var(--s1)" stroke="var(--s1s)" stroke-width="1.6"/>
<path d="M 587.0 231.0 A 150.0 150.0 0 0 1 465.7 441.2 L 460.2 389.5 A 98.0 98.0 0 0 0 539.5 252.1 Z" fill="var(--s2)" stroke="var(--s2s)" stroke-width="1.6"/>
<path d="M 434.3 441.2 A 150.0 150.0 0 0 1 313.0 231.0 L 360.5 252.1 A 98.0 98.0 0 0 0 439.8 389.5 Z" fill="var(--s3)" stroke="var(--s3s)" stroke-width="1.6"/>
<path d="M 585.2 197.4 A 165.0 165.0 0 0 1 599.5 222.3" fill="none" stroke="var(--line)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#a)"/>
<path d="M 464.4 456.4 A 165.0 165.0 0 0 1 435.6 456.4" fill="none" stroke="var(--line)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#a)"/>
<path d="M 300.5 222.3 A 165.0 165.0 0 0 1 314.8 197.4" fill="none" stroke="var(--line)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#a)"/>
<circle cx="450.0" cy="292.0" r="78.0" fill="var(--hub)"/>
<text class="kick" x="450.0" y="248.0" text-anchor="middle">ЯДРО</text>
<text class="hubmain" x="450.0" y="274.0" text-anchor="middle">какой нормативный</text>
<text class="hubmain" x="450.0" y="293.0" text-anchor="middle">результат применим</text>
<text class="hubmain" x="450.0" y="312.0" text-anchor="middle">к этому случаю</text>
<text class="hubmain" x="450.0" y="331.0" text-anchor="middle">в этом периоде</text>
<line x1="450.0" y1="196.0" x2="450.0" y2="210.0" stroke="var(--line)" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="533.1" y1="340.0" x2="521.0" y2="333.0" stroke="var(--line)" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="366.9" y1="340.0" x2="379.0" y2="333.0" stroke="var(--line)" stroke-width="1.3" marker-end="url(#a)"/>
<text class="ph" x="450" y="104" text-anchor="middle" fill="var(--s1s)">ПРАВКА</text>
<text class="sub" x="450" y="125" text-anchor="middle">нормы · события мира</text>
<text class="sub" x="450" y="141" text-anchor="middle">линтер до хода</text>
<text class="ph" x="613" y="386" text-anchor="start" fill="var(--s2s)">ПРОЖИВАНИЕ</text>
<text class="sub" x="613" y="407" text-anchor="start">очередь дел · бюджет</text>
<text class="sub" x="613" y="423" text-anchor="start">модели участников</text>
<text class="ph" x="287" y="386" text-anchor="end" fill="var(--s3s)">ОТЧЁТ</text>
<text class="sub" x="287" y="407" text-anchor="end">провалы · затронутые</text>
<text class="sub" x="287" y="423" text-anchor="end">non liquet</text>
<rect x="26" y="224" width="158" height="84" rx="9" fill="var(--card)" stroke="var(--cardline)" stroke-width="1.4" stroke-dasharray="5 4"/>
<text class="box" x="105.0" y="252" text-anchor="middle">AUCTOR</text>
<text class="boxsub" x="105.0" y="271" text-anchor="middle">учредительная власть</text>
<text class="boxsub" x="105.0" y="286" text-anchor="middle">вне политии</text>
<rect x="688" y="470" width="184" height="78" rx="9" fill="var(--card)" stroke="var(--cardline)" stroke-width="1.4"/>
<text class="box" x="780.0" y="498" text-anchor="middle">ЖУРНАЛ</text>
<text class="boxsub" x="780.0" y="517" text-anchor="middle">actor · должность · версии</text>
<text class="boxsub" x="780.0" y="532" text-anchor="middle">correlation ID</text>
<path d="M 184 244 C 240 206, 292 184, 344 180" fill="none" stroke="var(--line)" stroke-width="1.6" marker-end="url(#a)"/>
<text class="edge" x="258" y="176" text-anchor="middle">правит нормы</text>
<path d="M 310 336 C 268 348, 226 330, 188 300" fill="none" stroke="var(--line)" stroke-width="1.6" marker-end="url(#a)"/>
<text class="edge" x="256" y="360" text-anchor="middle">диагноз</text>
<path d="M 519 424 C 590 468, 640 486, 684 496" fill="none" stroke="var(--line)" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text class="edge" x="586" y="506" text-anchor="middle">каждый переход</text>
<text class="note" x="26" y="588">Ядро — <tspan font-style="italic">entitlement</tspan> и <tspan font-style="italic">deduction</tspan>: единственный ответчик, к которому обращается каждая фаза.</text>
<text class="note" x="26" y="608">Сценарий задаёт стартовый мир и дальше не участвует. Цензор читает журнал позже и решать не вправе.</text>
</svg>